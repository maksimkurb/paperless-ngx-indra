name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Tag must match the package version
        run: |
          v=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != package version $v"; exit 1; }
          grep -q "INDRA_PLUGIN_VERSION:-$v" init/10-indra.sh || { echo "init/10-indra.sh is not pinned to $v"; exit 1; }
      - run: pip install build && python -m build
      - name: Attach wheel to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # also fine when the release was already created in the GitHub UI
          gh release create "$GITHUB_REF_NAME" dist/* --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" dist/* --clobber
