# Daily check that the plugin still installs and works in the stock paperless-ngx image.
name: Compatibility
on:
  schedule:
    - cron: "17 5 * * *"
  pull_request:
    paths: [init/**, src/**, tests/smoke/**, pyproject.toml]
  workflow_dispatch:
    inputs:
      paperless_version:
        description: "paperless-ngx tag to test (default: latest release)"
        required: false
        default: ""

permissions:
  contents: read
  issues: write

jobs:
  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install via init script in the stock image, then run the smoke test
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT: ${{ inputs.paperless_version }}
        run: |
          ver="${INPUT:-$(gh api repos/paperless-ngx/paperless-ngx/releases/latest --jq .tag_name)}"
          plugin=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "paperless-ngx $ver, plugin $plugin"
          docker run --rm --entrypoint bash \
            -e INDRA_PLUGIN_VERSION="$plugin" -e INDRA_PLUGIN_SPEC=/tmp/plugin \
            -v "$PWD:/src:ro" \
            "ghcr.io/paperless-ngx/paperless-ngx:${ver#v}" \
            -c 'cp -r /src /tmp/plugin && /src/init/10-indra.sh && python3 /src/tests/smoke/paperless_smoke.py'
      - name: Open an issue when the scheduled run fails
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Compatibility check against latest paperless-ngx failed"
          if [ -z "$(gh issue list --search "$title in:title" --state open --json number --jq '.[0].number')" ]; then
            gh issue create --title "$title" \
              --body "See $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
